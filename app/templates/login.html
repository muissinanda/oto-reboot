<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OTO REBOOT</title>
    
    <!-- Modern Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: rgba(18, 26, 45, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #0f172a;
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            padding: 2.5rem;
        }

        .logo-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.75rem;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);
        }

        .form-control {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid var(--border-subtle) !important;
            color: #f1f5f9 !important;
            border-radius: 12px;
            padding: 0.8rem 1.1rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.95) !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
        }

        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.25s ease;
            width: 100%;
        }
        .btn-login:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
        }

        .btn-google {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="logo-box">
                <i class="bi bi-cpu"></i>
            </div>
            <h3 class="fw-extrabold mb-1 tracking-tight" style="font-weight: 800; letter-spacing: -0.03em;">OTO REBOOT</h3>
            <p class="text-secondary small mb-0">Portal Otentikasi Access Point Fleet Manager</p>
        </div>

        {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small border-0 mb-3" style="background: rgba(244, 63, 94, 0.15); color: #fb7185; border-radius: 10px;" role="alert">
                <i class="bi bi-exclamation-circle-fill fs-5"></i>
                <div style="font-size: 0.82rem;">{{ error }}</div>
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Ketik username Anda" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" id="loginPass" name="password" class="form-control border-start-0 border-end-0" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary border-start-0 border-secondary border-opacity-25" type="button" onclick="togglePass()">
                        <i class="bi bi-eye" id="loginEyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-login mb-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Sekarang
            </button>
        </form>

        <!-- Divider Opsi Google -->
        <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1 border-secondary opacity-25">
            <span class="px-3 text-secondary small text-uppercase font-mono" style="font-size: 0.68rem; letter-spacing: 0.05em;">atau masuk dengan</span>
            <hr class="flex-grow-1 border-secondary opacity-25">
        </div>

        <!-- Tombol Google Sign-in -->
        <a href="/auth/google/login" class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Daftar / Masuk Akun Google</span>
        </a>


    </div>

    <script>
        function togglePass() {
            const p = document.getElementById('loginPass');
            const icon = document.getElementById('loginEyeIcon');
            if (p.type === 'password') {
                p.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                p.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
